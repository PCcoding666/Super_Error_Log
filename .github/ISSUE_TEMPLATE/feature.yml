name: 需求
description: 提出新功能或改动
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的问题。不要在标题或正文里粘贴学生姓名、手机号或邀请码。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 希望达成什么？
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 场景
      description: 谁在什么情况下会用到？
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 做到什么程度算完成？
    validations:
      required: true
