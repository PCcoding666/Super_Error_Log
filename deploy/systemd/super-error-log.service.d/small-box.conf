# 2 核 / 1.8 GB 的广州小机。覆盖单元文件里的 4G / 300%。
# 不要在这台机器上直接套用 4G：物理内存不够，内核会先杀进程。
# 安装：
#   mkdir -p /etc/systemd/system/super-error-log.service.d
#   cp 本文件到该目录后 daemon-reload，再重启服务。
# 环境文件要一起改成小机档，见 deploy/README.md：
#   SEL_SERVICE_MEMORY_MIB=1024
#   SEL_MAX_LIVE_WORKERS=3
#   SEL_GLOBAL_AI_CONCURRENCY=1
#   SEL_GLOBAL_IMAGE_CONCURRENCY=1
# SEL_STUDENT_AI_CONCURRENCY 保持缺省 3：全局 1 已经把模型和图片各收成一路。
# 注册上限保持 SEL_MAX_STUDENTS 缺省 100：没人用的学生不占进程。

[Service]
MemoryMax=1G
MemoryLimit=1G
CPUQuota=150%
