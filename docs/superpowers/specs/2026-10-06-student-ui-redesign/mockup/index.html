<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>学生端重做原型</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#E6E4DE;color:#1F2A2C;-webkit-text-size-adjust:100%;line-height:1.45}
@media (prefers-color-scheme:dark){body{background:#0C0F10;color:#E4E8E7}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
input,textarea{font:inherit}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}

/* ───────── 演示控制台（不属于手机界面） ───────── */
.wrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px 20px 40px;min-height:100%}
.panel{--pb:#FBFAF7;--pc:#FFFFFF;--pi:#1F2A2C;--pm:#5E6A6C;--pl:#D9DDD6;--pa:#1F615C;--pab:#E1EEE9;
  width:380px;flex:none;background:var(--pb);border:1px solid var(--pl);border-radius:18px;padding:18px 18px 22px;color:var(--pi);font-size:14px;max-height:calc(100vh - 48px);overflow:auto;position:sticky;top:24px}
@media (prefers-color-scheme:dark){.panel{--pb:#161A1B;--pc:#1E2426;--pi:#E4E8E7;--pm:#9AA6A4;--pl:#30383A;--pa:#62BDB2;--pab:#1E302D}}
.panel h1{font-size:17px;margin:0 0 4px}
.panel .lead{color:var(--pm);font-size:12.5px;margin:0 0 12px}
.panel h2{font-size:12px;letter-spacing:.06em;color:var(--pm);margin:18px 0 8px;font-weight:700}
.scn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scn button,.opt button,.tg button{border:1px solid var(--pl);background:var(--pc);border-radius:10px;padding:8px 9px;text-align:left;font-size:12.5px;min-height:40px;line-height:1.3}
.scn button[aria-pressed=true],.opt button[aria-pressed=true],.tg button[aria-pressed=true]{background:var(--pa);border-color:var(--pa);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.scn button[aria-pressed=true],.opt button[aria-pressed=true],.tg button[aria-pressed=true]{color:#06211F}}
.dec{border:1px solid var(--pl);background:var(--pc);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.dec .q{font-weight:700;font-size:13.5px;margin-bottom:6px}
.dec .q small{font-weight:600;color:var(--pm);margin-right:6px}
.opt{display:flex;flex-direction:column;gap:5px}
.opt button{display:flex;gap:6px;align-items:flex-start}
.opt .rec{margin-left:auto;font-size:11px;font-weight:700;color:var(--pa);white-space:nowrap}
.opt button[aria-pressed=true] .rec{color:inherit}
.dec .why{font-size:12px;color:var(--pm);margin-top:6px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{min-height:36px}
.note{background:var(--pab);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.note b{display:block;margin-bottom:3px}
.panel .reset{margin-top:14px;border:1px solid var(--pl);border-radius:10px;padding:8px 12px;background:var(--pc);font-size:12.5px}
.panel .close{display:none}

/* ───────── 手机 ───────── */
.stage{flex:none;position:sticky;top:24px}
.phone{--paper:#F6F4EE;--card:#FFFFFF;--ink:#1D2E31;--muted:#5B696B;--teal:#1F615C;--on-teal:#FFFFFF;--mint:#DFECE6;--line:#DCE0D9;
  --blue:#2B67D1;--blue-bg:#E4ECFA;--orange:#B05208;--orange-bg:#FBEBD8;--green:#1E7A4C;--green-bg:#DFF1E6;--red:#BE3A2C;--red-bg:#FBE5E1;--gray-bg:#ECEDEC;
  --bar18:rgba(247,246,242,.9);--glass:rgba(255,255,255,.42);--glass-line:rgba(255,255,255,.75);--sheet:#FFFFFF;--dim:rgba(0,0,0,.32);
  --top:47px;--bot:34px;
  width:390px;height:844px;border-radius:55px;background:var(--paper);position:relative;overflow:hidden;color:var(--ink);font-size:16px;
  box-shadow:0 0 0 11px #18191A,0 0 0 12px #3B3E40,0 30px 70px rgba(0,0,0,.28);transform-origin:top center}
.phone.dark{--paper:#111516;--card:#1C2224;--ink:#E8EDEC;--muted:#9AA8A6;--teal:#5DB8AD;--on-teal:#06211F;--mint:#1D312E;--line:#2F383A;
  --blue:#78A5F2;--blue-bg:#1B2A42;--orange:#EAA25A;--orange-bg:#3A2A17;--green:#62C08A;--green-bg:#18301F;--red:#E8786A;--red-bg:#3D201B;--gray-bg:#262C2E;
  --bar18:rgba(22,26,27,.9);--glass:rgba(40,48,50,.45);--glass-line:rgba(255,255,255,.18);--sheet:#1C2224;--dim:rgba(0,0,0,.55)}
.phone.glassy{background:linear-gradient(160deg,#E8F1EE 0%,#F4EEDF 45%,#E7ECF6 100%)}
.phone.dark.glassy{background:linear-gradient(160deg,#10201E 0%,#1B1912 45%,#121826 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;font-weight:600;font-size:15.5px;z-index:40;pointer-events:none}
.sb .bat{display:inline-block;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;margin-left:6px;vertical-align:-1px}
.sb .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
.hi{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;z-index:80;pointer-events:none}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--top) + 62px) 16px calc(var(--bot) + 176px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.phone.root .scr{padding-top:calc(var(--top) + 54px)}
.ios26.root .nav::before{height:calc(var(--top) + 6px)}
.phone.tabs.root .scr{padding-bottom:calc(var(--bot) + 200px)}

/* 导航栏：iOS 26 浮动玻璃按钮；iOS 18 实色栏 */
.nav{position:absolute;top:var(--top);left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;z-index:30}
.nav .nt{flex:1;text-align:center;font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .side{min-width:44px;display:flex;gap:6px;align-items:center}
.nav .side.r{justify-content:flex-end}
.ios26 .nav::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--top));height:calc(var(--top) + 66px);background:linear-gradient(to bottom,var(--paper) 72%,transparent);z-index:-1;pointer-events:none;opacity:.97;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ios26.glassy .nav::before{opacity:.5}
.ios26 .navb{height:44px;min-width:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 14px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.10);font-weight:600;font-size:15.5px;color:var(--ink)}
.ios26 .navb.circle{padding:0;width:44px}
.ios18 .nav{background:var(--bar18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line);height:44px}
.ios18 .nav::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--top));height:var(--top);background:var(--bar18)}
.ios18.root .nav{border-bottom-color:transparent;background:var(--paper)}
.ios18.root .nav::before{background:var(--paper)}
.ios18 .navb{color:var(--teal);font-size:16.5px;display:inline-flex;align-items:center;gap:1px;min-height:44px;font-weight:500}
.ios18 .navb .ic{width:22px;height:22px;stroke-width:2.3}
.ios18 .scr{padding-top:calc(var(--top) + 60px)}
.reduceT .navb{background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* 内容 */
.lt{font-size:33px;font-weight:750;letter-spacing:.01em;margin:0 2px}
.lt-sub{color:var(--muted);font-size:14px;margin:0 2px 12px}
.h2{font-size:22px;font-weight:700;margin:4px 2px 6px}
.p{font-size:15px;color:var(--muted);margin:0 2px 14px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.glassy .card,.glassy .row,.glassy .stepcard{background:rgba(255,255,255,.38)!important;border-color:rgba(255,255,255,.7)!important;backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 20px rgba(0,0,0,.06)}
.dark.glassy .card,.dark.glassy .row,.dark.glassy .stepcard{background:rgba(40,48,50,.4)!important;border-color:rgba(255,255,255,.12)!important}
.glassy .muted,.glassy .p,.glassy .rd{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:8px;min-height:56px}
.row .rm{flex:1;min-width:0}
.row .rt{font-weight:600;font-size:16px}
.row .rd{font-size:13.5px;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;border-radius:999px;padding:2px 9px;white-space:nowrap}
.c-blue{background:var(--blue-bg);color:var(--blue)}.c-orange{background:var(--orange-bg);color:var(--orange)}.c-green{background:var(--green-bg);color:var(--green)}.c-red{background:var(--red-bg);color:var(--red)}.c-gray{background:var(--gray-bg);color:var(--muted)}
.t-orange{color:var(--orange)}.t-green{color:var(--green)}.t-red{color:var(--red)}.t-blue{color:var(--blue)}.t-teal{color:var(--teal)}
.link{color:var(--teal);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.demo-chip{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:16px 0 4px;min-height:44px;border:1.5px dashed #8E6BC9;color:#7A55B8;border-radius:12px;font-size:14px;font-weight:600;background:transparent}
.dark .demo-chip{color:#B79AE8;border-color:#9C7AD6}

/* 节奏条 */
.rhythm{display:flex;align-items:stretch;gap:4px;margin:0 0 14px}
.rhythm .seg{flex:1;border-radius:12px;padding:7px 8px;background:var(--gray-bg);color:var(--muted);font-size:12px;line-height:1.3}
.rhythm .seg b{display:block;font-size:13px;color:var(--ink);opacity:.75}
.rhythm .seg.on{background:var(--teal);color:var(--on-teal)}
.rhythm .seg.on b{color:var(--on-teal);opacity:1}
.rhythm .seg.past{background:var(--mint)}
.rhythm .arr{align-self:center;color:var(--muted);font-size:12px}

/* 清单 */
.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 6px 4px;margin-bottom:6px}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 6px;font-size:13.5px;color:var(--muted)}
.plan .ph b{color:var(--ink);font-size:15px}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 10px;border-radius:14px;border:1.5px solid transparent;position:relative}
.step + .step{margin-top:2px}
.step .num{width:28px;height:28px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:1.5px solid var(--line);color:var(--muted);margin-top:1px}
.step.done .num{background:var(--green-bg);border-color:transparent;color:var(--green)}
.step.done .num .ic{width:16px;height:16px;stroke-width:2.6}
.step.cur{border-color:var(--teal);background:color-mix(in srgb,var(--mint) 55%,transparent)}
.step.cur .num{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.step .sm{flex:1;min-width:0}
.step .st{font-weight:650;font-size:16.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step.done .st{color:var(--muted);font-weight:600}
.step .sd{font-size:13.5px;color:var(--muted);margin-top:2px}
.step .tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--gray-bg);color:var(--muted)}
.step .now{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--teal);color:var(--on-teal)}
.step .mins{font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:3px}
.step .inl{margin-top:10px}
.stepcard{background:var(--card);border:1.5px solid var(--teal);border-radius:22px;padding:18px;margin-bottom:10px}
.stepcard .big-ic{width:52px;height:52px;border-radius:16px;background:var(--mint);color:var(--teal);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stepcard .big-ic .ic{width:28px;height:28px}
.dots{display:flex;gap:6px;margin:2px 2px 12px;align-items:center;font-size:13px;color:var(--muted)}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line);display:block}
.dots i.d{background:var(--green)}.dots i.c{background:var(--teal)}

/* 大卡 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;margin-bottom:10px}
.hero .ht{font-size:21px;font-weight:750;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hero .ht .okc{width:30px;height:30px;border-radius:15px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center}
.hero p{margin:0 0 10px;font-size:15.5px}
.hero .rules{margin:6px 0 10px;padding:10px 12px;border-radius:12px;background:var(--paper);font-size:14px;color:var(--ink)}
.hero .rules div{margin:2px 0}
.nexttime{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--gray-bg)}

/* 横幅 */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:14px;background:var(--gray-bg);color:var(--ink)}
.banner.warn{background:var(--orange-bg)}
.banner .bm{flex:1}
.banner button{color:var(--teal);font-weight:650;white-space:nowrap;min-height:32px}

/* 下一步按钮 */
.nbar{position:absolute;left:0;right:0;bottom:0;padding:8px 16px calc(var(--bot) + 6px);z-index:35}
.nbar.ios18bar{background:var(--bar18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line)}
.nbar.is-glass::before,.nbar.is-solid.ios26bar::before{content:"";position:absolute;left:0;right:0;bottom:0;top:-26px;background:linear-gradient(to top,var(--paper) 78%,transparent);opacity:.97;pointer-events:none;z-index:-1;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.glassy .nbar.is-glass::before{opacity:.35}
.nb-cap{font-size:13px;color:var(--muted);text-align:center;margin:0 0 7px;min-height:17px}
.nb-row{display:flex;gap:10px;align-items:stretch}
.nb-prim{flex:1;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:650;padding:0 18px}
.nb-prim.solid{background:var(--teal);color:var(--on-teal);border-radius:16px}
.nb-prim.gp{border-radius:999px;color:#fff;background:color-mix(in srgb,#1F615C 90%,transparent);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.5),inset 0 -1px 1px rgba(0,0,0,.2),0 10px 26px rgba(20,70,66,.32);border:1px solid rgba(255,255,255,.28)}
.dark .nb-prim.gp{background:color-mix(in srgb,#3E9E93 82%,transparent);color:#04201D}
.nb-prim:disabled{opacity:.5;cursor:default}
.nb-sec{min-height:54px;padding:0 16px;font-size:15.5px;font-weight:600}
.nb-sec.g{border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 6px 16px rgba(0,0,0,.09)}
.nb-sec.outline{border-radius:16px;border:1.5px solid var(--teal);color:var(--teal);background:var(--card)}
.nb-link{display:block;margin:6px auto 0;color:var(--teal);font-weight:600;font-size:14.5px;min-height:34px}
.reduceT .nb-prim.gp{background:var(--teal);color:var(--on-teal);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border:0}
.reduceT .nb-sec.g{background:var(--card);border:1.5px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.inline-next{margin:18px 0 0}
.inline-next .nb-prim.solid,.inline-next .nb-prim.gp{border-radius:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp 0.9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* 标签栏（D1-C） */
.tabbar{position:absolute;z-index:36;display:flex;justify-content:space-around;align-items:center}
.ios26 .tabbar{left:22px;right:22px;bottom:calc(var(--bot) - 8px);height:62px;border-radius:31px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 8px 24px rgba(0,0,0,.12)}
.ios18 .tabbar{left:0;right:0;bottom:0;height:calc(var(--bot) + 50px);padding-bottom:var(--bot);background:var(--bar18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line)}
.reduceT .tabbar{background:var(--card)!important;backdrop-filter:none!important}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);min-width:76px;min-height:48px;justify-content:center;border-radius:24px}
.tabbar button.on{color:var(--teal)}
.ios26 .tabbar button.on{background:color-mix(in srgb,var(--teal) 14%,transparent)}
.tabs.root .nbar{bottom:calc(var(--bot) + 58px);padding-bottom:6px}
.ios18.tabs.root .nbar{bottom:calc(var(--bot) + 50px)}
.tabs.root .nbar.is-glass::before,.tabs.root .nbar.ios26bar::before{display:none}

/* 卷子缩略、裁图、练习纸 */
.paper{background:#FCFBF6;color:#222;border-radius:6px;border:1px solid #D8D4C8;padding:5px 6px;overflow:hidden;position:relative;font-family:"Songti SC","STSong",serif}
.paper .pt{font-size:6.5px;text-align:center;font-weight:700;margin-bottom:3px;letter-spacing:.05em}
.paper .pl{font-size:5px;line-height:1.55;color:#444;white-space:nowrap;position:relative}
.paper .pl i{color:#C62828;font-style:normal;font-weight:700;font-size:7px;position:absolute;right:2px;top:-2px}
.paper.blur{filter:blur(1.6px) contrast(.8)}
.thumbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 10px}
.tile{display:flex;flex-direction:column;gap:5px;text-align:left}
.tile .paper{height:128px}
.tile .tl{font-size:12px;font-weight:600}
.tile.add{align-items:center;justify-content:center;height:128px;border:2px dashed var(--teal);border-radius:10px;color:var(--teal);font-weight:650;font-size:14px;gap:6px;background:color-mix(in srgb,var(--mint) 40%,transparent)}
.tile.add .ic{width:28px;height:28px}
.pthumb{width:54px;height:70px;flex:none;overflow:hidden;border-radius:6px}
.pthumb .paper{height:100%;padding:3px 4px}
.pthumb .paper .pt{font-size:4.5px}.pthumb .paper .pl{font-size:3.6px}.pthumb .paper .pl i{font-size:5px}
.crop{background:#FCFBF6;color:#1C1C1C;border-radius:10px;border:1px solid #DDD8CB;padding:10px 40px 10px 12px;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:14.5px;line-height:1.6;position:relative;overflow:hidden}
.crop.small{max-height:96px;font-size:13px;padding:8px 10px}
.crop .hand{font-family:"Kaiti SC","STKaiti","KaiTi",cursive;color:#1D3E9C;font-size:15px;margin-top:4px}

V.results = function(o){

  if (isRoot) nav = `<div class="nav"><div class="side"></div><div class="nt"></div><div class="side r">${right}</div></div>`;
  else {
    const prev = S.stack[S.stack.length - 2]; const prevTitle = prev.s === 'today' ? '今天' : ({capture:'拍卷子', photos:'勾错题', items:'错题', detail:'题目', choose:'选题', why:'返回', print:'打印', record:'录结果', results:'结果', older:'练习', chosen:'返回'}[prev.s] || '返回');
    const back = P.ios === '26' ? `<button class="navb circle" data-act="back" aria-label="返回">${ic('back')}</button>` : `<button class="navb" data-act="back">${ic('back')}${esc(prevTitle)}</button>`;
    nav = `<div class="nav"><div class="side">${back}</div><div class="nt">${esc(view.title || '')}</div><div class="side r">${right}</div></div>`;
  }
  const tabbar = P.d1 === 'C' && isRoot && plan().phase !== 'connect' ? `<div class="tabbar">${[['today','今天','home'],['items','错题','book'],['paper','练习纸','doc']].map(([k, l, i]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-arg="${k}">${ic(i)}${l}</button>`).join('')}</div>` : '';
  let next = view.next;
  if (P.d1 === 'C' && isRoot && S.tab !== 'today') { const pl = plan(); next = pl.phase === 'steps' ? gateOffline(nextFor(pl)) : null; }
  let bar = '', inline = '';
  if (P.d2 === 'B') inline = t.s === 'today' && P.d1 !== 'B' ? '' : inlineHTML(next);
  else bar = barHTML(next);
  const toastH = S.toast ? `<div class="toast ${S.toast.id !== lastToast ? 'anim' : ''}" role="status"><span>${esc(S.toast.text)}</span>${S.toast.act ? `<button data-act="${S.toast.act}" data-arg="${esc(S.toast.arg)}">${esc(S.toast.label)}</button>` : ''}</div>` : '';
  ph.innerHTML = `<div class="sb"><span>9:41</span><span>5G<span class="bat"></span></span></div>${nav}<div class="scr" id="scr" data-key="${key}">${t.s === 'today' || isRoot ? '' : bannerHTML()}${view.body}${inline}</div>${bar}${tabbar}${toastH}${sheetHTML()}${layerHTML()}${alertHTML()}<div class="hi"></div>`;
  lastSheet = S.sheet ? S.sheet.s : ''; lastToast = S.toast ? S.toast.id : 0;
  const sc = $('#scr'); if (sc && S.scroll[key] != null) sc.scrollTop = S.scroll[key];
  const sh = $('#shb'); if (sh) sh.scrollTop = shScroll;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({preventScroll:true}); try { el.setSelectionRange(selS, selE); } catch (e) {} } }
  // 控制台
  const sheetNote = S.sheet ? SH[S.sheet.s]().note : null;
  $('#note').innerHTML = (sheetNote || view.note || '') + `<div style="margin-top:8px;color:var(--pm)">现在：${DAYS[S.day].label} · 系统 ${P.ios === '26' ? 'iOS 26+' : 'iOS 18–25'}${P.reduceT ? ' · 降低透明度' : ''}</div>`;
  $('#bandText').textContent = `${DAYS[S.day].label} · D1 ${P.d1} · D2 ${P.d2} · D3 ${P.d3} · D4 ${P.d4} · D5 ${P.d5} · ${P.ios === '26' ? 'iOS 26+' : 'iOS 18'}`;
  renderPanel();
}

/* ───────── 控制台 ───────── */
const DECS = [
  {k:'d1', n:'D1', q:'首页长什么样', opts:[['A','「今天」清单：全部步骤可见，当前一步高亮',1],['B','单卡：只显示现在这一步'],['C','底部三个标签：今天 · 错题 · 练习纸']], why:'推荐 A：看得到还剩几步，心里有数。C 多了三个要找的地方，玻璃标签栏好看但不帮引导。'},
  {k:'d2', n:'D2', q:'下一步按钮放哪', opts:[['A','固定在屏幕底部，每屏同一位置',1],['B','放在当前步骤卡片里 / 内容最后，跟着滚']], why:'推荐 A：拇指够得着、每屏一样，学一次就会。B 在长页面上会滚出屏幕——正是今天的问题。'},
  {k:'d3', n:'D3', q:'「说说为什么错」放在哪', opts:[['A','打印前，可一键跳过',1],['B','打印后（先保证纸打出来）']], why:'推荐 A：和 v2 设计的顺序一致；两种都在做纸之前记下「把握」。A 的风险是时间不够时挡住打印，所以「跳过」一直在。'},
  {k:'d4', n:'D4', q:'录结果怎么录', opts:[['A','一题一屏，大按钮，填完点「下一道」',1],['B','一页列表（今天的样子，改了文案和日期）']], why:'推荐 A：每屏一个问题，不会漏填。B 点得少，但 6 张卡 × 5 个选项很长。'},
  {k:'d5', n:'D5', q:'Liquid Glass 用多少', opts:[['A','系统自带 + 底部下一步按钮一处',1],['B','只要系统自带，自己不加'],['C','卡片也做成玻璃（看看为什么不推荐）']], why:'推荐 A：最重要的按钮最显眼且与系统一致。B 也行（少测一套外观）。C 违反 Apple 规范：题目照片上压了半透明标签，题干变难读——到「这周的错题」里看最明显。'},
];
function renderPanel(){
  $('#scn').innerHTML = SCN.map(([k, l]) => `<button aria-pressed="${curScn === k}" data-act="scn" data-arg="${k}">${l}</button>`).join('');
  $('#decs').innerHTML = DECS.map(d => `<div class="dec"><div class="q"><small>${d.n}</small>${d.q}</div><div class="opt">${d.opts.map(([v, t, r]) => `<button aria-pressed="${P[d.k] === v}" data-act="dec" data-arg="${d.k}|${v}"><b>${v}</b><span>${t}</span>${r ? '<span class="rec">推荐</span>' : ''}</button>`).join('')}</div><div class="why">${d.why}</div></div>`).join('');
  $('#prev').innerHTML = [['ios','26','iOS 26 及以上'],['ios','18','iOS 18–25'],['reduceT',true,'降低透明度'],['dark',true,'深色']].map(([k, v, l]) => `<button aria-pressed="${k === 'ios' ? P.ios === v : !!P[k]}" data-act="pref" data-arg="${k}|${v}">${l}</button>`).join('');
  const cs = !S.online ? 'offline' : (!S.paired ? 'unpaired' : S.conn);
  $('#conn').innerHTML = [['ready','正常'],['failed','连不上服务器'],['busy','服务器忙'],['unauthorized','要重新扫码'],['incompatible','版本对不上'],['offline','没联网']].map(([k, l]) => `<button aria-pressed="${cs === k}" data-act="connSet" data-arg="${k}">${l}</button>`).join('');
}
ACT.scn = k => { scenario(k); $('#panel').classList.remove('open'); };
ACT.dec = arg => { const [k, v] = arg.split('|'); P[k] = v; saveP(); if (k === 'd4' && S.rec && S.rec.phase === 'item' && v === 'B') S.rec.phase = 'date'; };
ACT.pref = arg => { const [k, v] = arg.split('|'); if (k === 'ios') P.ios = v; else P[k] = !P[k]; saveP(); };
ACT.connSet = k => { if (k === 'offline') { S.online = false; S.conn = 'ready'; S.paired = true; } else { const wasOff = !S.online; S.online = true; S.paired = true; S.conn = k; if (wasOff && S.consent) weekPhotos().filter(p => p.state === 'local').forEach(startPipe); } if (k === 'ready' || k === 'failed' || k === 'busy' || k === 'offline') { if (topS().s === 'today') S.qrError = false; } };

/* ───────── 事件 ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (!a || !ACT[a]) return;
  if (el.disabled) return;
  e.preventDefault();
  ACT[a](el.dataset.arg);
  if (a !== 'openPanel' && a !== 'closePanel') render();
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'whyAns' && S.why) { S.why.ans = e.target.value; render(); }
  else if (id === 'whySum' && S.why && S.why.form) { S.why.form.sum = e.target.value; render(); }
  else if (id === 'pickIn' && S.pick) { S.pick.input = e.target.value; S.pick.on = {}; S.pick.off = {}; render(); }
  else if (id === 'fixIn' && S.fix) { S.fix.text = e.target.value; render(); }
  else if (id === 'slotOther' && S.choose) { S.choose.other = e.target.value; }
});
/* 按住说话：按住 0.25 秒才开始；轻点给提示；第一次先要权限 */
let hold = null;
const SAY = {pick:'4 和 6', fix:'第二行的 9 应该是 8'};
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-hold]'); if (!el) return;
  e.preventDefault();
  const scope = el.dataset.hold;
  if (!S.micPerm) { S.alert = {s:'mic'}; render(); return; }
  hold = {scope, t0: Date.now(), started:false, timer: setTimeout(() => { hold.started = true; startSpeech(scope); }, 250)};
});
function endHold(){
  if (!hold) return; clearTimeout(hold.timer); clearInterval(hold.iv);
  if (!hold.started) { setHint('要按住不放，边按边说，说完松手'); }
  else { setHint(''); }
  hold = null; render();
}
document.addEventListener('pointerup', endHold); document.addEventListener('pointercancel', endHold);
function startSpeech(scope){
  const full = scope === 'why' ? (Q[curPractice().ids[S.why.i]].say || '我当时没想清楚这一步') : SAY[scope];
  let i = 0; setHint('正在听…松手结束');
  const base = scope === 'why' ? S.why.ans : scope === 'pick' ? S.pick.input : S.fix.text;
  const btn = () => document.querySelector('[data-hold]');
  const b = btn(); if (b) { b.classList.add('rec'); b.querySelector('span').textContent = '正在听…松手结束'; }
  hold.iv = setInterval(() => {
    if (!hold) return; i = Math.min(full.length, i + 2); const txt = (base ? base + ' ' : '') + full.slice(0, i);
    if (scope === 'why') S.why.ans = txt; else if (scope === 'pick') { S.pick.input = txt; S.pick.on = {}; S.pick.off = {}; } else S.fix.text = txt;
    render(); const bb = btn(); if (bb) { bb.classList.add('rec'); bb.querySelector('span').textContent = '正在听…松手结束'; }
  }, 120);
}

/* 桌面缩放：窗口太矮时整台手机等比缩小 */
function fit(){
  const ph = $('#phone'); if (window.innerWidth <= 640) { ph.style.transform = ''; $('#stage').style.height = ''; return; }
  const k = Math.min(1, (window.innerHeight - 60) / 866);
  ph.style.transform = k < 1 ? `scale(${k})` : ''; $('#stage').style.height = (866 * k) + 'px';
}
window.addEventListener('resize', fit);
scenario('A0'); fit();
</script>
