{% extends "base.html" %}

{% block title %}上传错题 - {{ app_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <p class="text-muted mb-1">学生每日入口</p>
        <h1 class="h3 mb-0">今天先做哪一步</h1>
    </div>
    <a href="{{ url_for('review_queue') }}" class="btn btn-outline-primary">
        <i class="bi bi-calendar-check"></i>
        <span>去复习</span>
    </a>
</div>

<section class="surface">
    <form method="post" enctype="multipart/form-data" id="upload-form">
        <label class="upload-panel" for="file-input">
            <i class="bi bi-camera fs-1"></i>
            <strong>学生拍照或选择错题图片</strong>
            <span>系统先保存原图，再用 AI 生成待确认错题信息</span>
            <input
                type="file"
                name="file"
                id="file-input"
                accept="image/png,image/jpeg,image/webp"
                capture="environment"
                required
            >
        </label>

        <img id="preview-image" class="preview-image" src="" alt="错题图片预览">

        <div class="mt-3">
            <label class="form-label fw-semibold">识别范围</label>
            <div class="focus-grid" role="group" aria-label="识别范围">
                <input class="btn-check" type="radio" name="focus_region" id="focus-full" value="full" checked>
                <label class="btn btn-outline-secondary" for="focus-full">整张图片</label>

                <input class="btn-check" type="radio" name="focus_region" id="focus-left" value="left">
                <label class="btn btn-outline-secondary" for="focus-left">左半部分</label>

                <input class="btn-check" type="radio" name="focus_region" id="focus-right" value="right">
                <label class="btn btn-outline-secondary" for="focus-right">右半部分</label>

                <input class="btn-check" type="radio" name="focus_region" id="focus-upper-left" value="upper_left">
                <label class="btn btn-outline-secondary" for="focus-upper-left">左上区域</label>

                <input class="btn-check" type="radio" name="focus_region" id="focus-upper-right" value="upper_right">
                <label class="btn btn-outline-secondary" for="focus-upper-right">右上区域</label>

                <input class="btn-check" type="radio" name="focus_region" id="focus-lower-left" value="lower_left">
                <label class="btn btn-outline-secondary" for="focus-lower-left">左下区域</label>

                <input class="btn-check" type="radio" name="focus_region" id="focus-lower-right" value="lower_right">
                <label class="btn btn-outline-secondary" for="focus-lower-right">右下区域</label>
            </div>
            <div class="form-text">整张图有多道题时，先选错题所在区域，再上传识别。</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" id="submit-btn">
            <i class="bi bi-magic"></i>
            <span>保存原图并生成待确认错题</span>
        </button>
    </form>
</section>

<section class="mt-4">
    <div class="info-strip">
        <div><strong>先上传</strong><span>拍清楚题目、学生答案和批改痕迹</span></div>
        <div><strong>再校对</strong><span>学生快速检查 AI 识别内容，不准就改</span></div>
        <div><strong>按期复习</strong><span>确认后的错题会进入学生复习队列</span></div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
const fileInput = document.getElementById("file-input");
const preview = document.getElementById("preview-image");
const form = document.getElementById("upload-form");
const submitBtn = document.getElementById("submit-btn");

fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) {
        preview.style.display = "none";
        return;
    }
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});

form.addEventListener("submit", () => {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>处理中';
});
</script>
{% endblock %}
